metadata:
  name: dex-domain
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dex-domain
subjects:
  - kind: ServiceAccount
    name: dex-domain
    namespace: {{ .Release.Namespace }}
