apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dex-domain
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - admin-login
      - admin-access
      - oidc-client
      - dex-config
    verbs:
      - get
      - update
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
