apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: dex-reload-credentials
spec:
  evaluation:
    mutateExisting:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - UPDATE
        resources:
          - secrets
        resourceNames:
          - dex-config
  matchConditions:
    - name: credential-data-changed
      expression: request.object.data != request.oldObject.data
  targetMatchConstraints:
    expression: resource.Get("apps/v1", "deployments", {{ .Release.Namespace | quote }}, "dex")
  variables:
    - name: dataChanged
      expression: request.object.data != request.oldObject.data
    - name: sourceVersion
      expression: request.object.metadata.resourceVersion
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          !variables.dataChanged ? [] : has(object.spec.template.metadata.annotations) ?
          [JSONPatch{op: "add", path: "/spec/template/metadata/annotations/lab.ai~1credential-dex-config",
            value: variables.sourceVersion}] :
          [JSONPatch{op: "add", path: "/spec/template/metadata/annotations",
            value: {"lab.ai/credential-dex-config": variables.sourceVersion}}]
