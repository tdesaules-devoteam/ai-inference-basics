apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: bastion-public-ca
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
    orphanDownstreamOnPolicyDelete:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - namespaces
        resourceNames:
          - {{ .Release.Namespace }}
  variables:
    - name: source
      expression: resource.Get("v1", "configmaps", "gateway", "lab-ca")
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: lab-ca
            namespace: {{ .Release.Namespace }}
          type: Opaque
          stringData:
            ca.crt: (( variables.source.data["ca.crt"] ))
