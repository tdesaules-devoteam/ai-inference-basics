{{- if not .Values.localHttp }}
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: bastion-public-ca
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
    orphanDownstreamOnPolicyDelete:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - configmaps
        resourceNames:
          - lab-ca
  matchConditions:
    - name: public-gateway-ca
      expression: object.metadata.namespace == "gateway"
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: lab-ca
            namespace: {{ .Release.Namespace }}
          type: Opaque
          stringData:
            ca.crt: (( object.data["ca.crt"] ))
{{- end }}
