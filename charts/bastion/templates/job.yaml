apiVersion: batch/v1
kind: Job
metadata:
  name: bastion-config
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  activeDeadlineSeconds: 180
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: bastion-config
      restartPolicy: Never
      containers:
        - name: configure
          image: {{ required "toolsImage is required" .Values.toolsImage | quote }}
          imagePullPolicy: {{ .Values.toolsImagePullPolicy | default "IfNotPresent" }}
          command:
            - python3
            - /scripts/credentials.py
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: scripts
          configMap:
            name: bastion-config
