apiVersion: apps/v1
kind: Deployment
metadata:
  name: bastion
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bastion
  template:
    metadata:
      labels:
        app: bastion
      annotations:
        checksum/workspace: {{ include (print $.Template.BasePath "/config-map-workspace.yaml") . | sha256sum }}
    spec:
      serviceAccountName: bastion
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: workspace
          image: {{ required "bastionImage is required" .Values.bastionImage | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default "IfNotPresent" }}
          command:
            - python3
            - /scripts/workspace.py
          env:
            - name: REPOSITORY_URL
              value: {{ .Values.repository.url | quote }}
            - name: REPOSITORY_DIRECTORY
              value: {{ .Values.repository.directory | quote }}
            - name: EDITOR_THEME
              value: {{ .Values.editor.theme | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: workspace-config
              mountPath: /scripts
              readOnly: true
            - name: temporary
              mountPath: /tmp
      containers:
        {{- range $component := list "terminal" "editor" }}
        - name: {{ $component }}
          image: {{ required "bastionImage is required" $.Values.bastionImage | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy | default "IfNotPresent" }}
          {{- if eq $component "editor" }}
          command:
            - code-server
          args:
            - --auth
            - none
            - --bind-addr
            - "0.0.0.0:8080"
            - --disable-telemetry
            - --disable-update-check
            - --ignore-last-opened
            - {{ $.Values.repository.directory | quote }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: EDITOR
              value: hx
            - name: VISUAL
              value: hx
            - name: KUBE_EDITOR
              value: hx
            - name: STARSHIP_CONFIG
              value: /etc/lab-ui/starship.toml
            - name: LAB_NAMESPACE
              value: bastion
            - name: TERMINAL_BASE_PATH
              value: /terminal
            - name: OPENAI_BASE_URL
              value: {{ $.Values.apiBaseUrl | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lab-api-key
                  key: lab
            - name: SSL_CERT_FILE
              value: /workspace/.config/lab-ca-bundle.pem
            - name: REQUESTS_CA_BUNDLE
              value: /workspace/.config/lab-ca-bundle.pem
            - name: CURL_CA_BUNDLE
              value: /workspace/.config/lab-ca-bundle.pem
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/lab-ca/ca.crt
          ports:
            - name: {{ $component }}
              containerPort: {{ if eq $component "terminal" }}7681{{ else }}8080{{ end }}
          readinessProbe:
            httpGet:
              path: {{ if eq $component "terminal" }}/terminal/{{ else }}/healthz{{ end }}
              port: {{ $component }}
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: workspace-config
              mountPath: /etc/lab-ui
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: ca
              mountPath: /etc/lab-ca
              readOnly: true
            - name: temporary
              mountPath: /tmp
        {{- end }}
      volumes:
        - name: workspace-config
          configMap:
            name: bastion-workspace
        - name: workspace
          persistentVolumeClaim:
            claimName: bastion
        - name: ca
          secret:
            secretName: lab-ca
        - name: temporary
          emptyDir:
            sizeLimit: 1Gi
