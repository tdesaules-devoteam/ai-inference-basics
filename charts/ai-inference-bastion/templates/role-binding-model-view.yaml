{{- range .Values.participants }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bastion-{{ . }}-model-view
  namespace: inference-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-inspection
subjects:
  - kind: ServiceAccount
    name: bastion-{{ . }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
