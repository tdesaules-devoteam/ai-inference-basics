apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-inference-bastion-inspection
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-inference-bastion-inspection
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ai-inference-bastion-inspection}
subjects:
  {{- range .Values.participants }}
  - {kind: ServiceAccount, name: bastion-{{ . }}, namespace: {{ $.Release.Namespace }}}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-inspection
  namespace: inference-service
rules:
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices, servingruntimes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, pods/log, services, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
{{- range $participant := .Values.participants }}
apiVersion: v1
kind: Namespace
metadata:
  name: lab-{{ . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bastion-{{ . }}
  namespace: {{ $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: participant-edit
  namespace: lab-{{ . }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edit}
subjects:
  - {kind: ServiceAccount, name: bastion-{{ . }}, namespace: {{ $.Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bastion-{{ . }}-model-view
  namespace: inference-service
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: model-inspection}
subjects:
  - {kind: ServiceAccount, name: bastion-{{ . }}, namespace: {{ $.Release.Namespace }}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bastion-{{ . }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $.Values.storageClass }}
  resources:
    requests:
      storage: {{ $.Values.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bastion-{{ . }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: bastion-{{ . }}}
  template:
    metadata:
      labels: {app: bastion-{{ . }}}
    spec:
      serviceAccountName: bastion-{{ . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        {{- range $component := list "terminal" "editor" }}
        - name: {{ $component }}
          image: {{ required "toolsImage is required" $.Values.toolsImage | quote }}
          imagePullPolicy: {{ $.Values.toolsImagePullPolicy | default "IfNotPresent" }}
          {{- if eq $component "editor" }}
          command: [code-server]
          args: [--auth, none, --bind-addr, "0.0.0.0:8080", --disable-telemetry, --disable-update-check, /workspace]
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: LAB_NAMESPACE, value: lab-{{ $participant }}}
            - {name: TERMINAL_BASE_PATH, value: /terminal-{{ $participant }}}
            - {name: OPENAI_BASE_URL, value: {{ $.Values.apiBaseUrl | quote }}}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: lab-api-key, key: lab}
            - {name: SSL_CERT_FILE, value: /workspace/.config/lab-ca-bundle.pem}
            - {name: REQUESTS_CA_BUNDLE, value: /workspace/.config/lab-ca-bundle.pem}
            - {name: CURL_CA_BUNDLE, value: /workspace/.config/lab-ca-bundle.pem}
            - {name: NODE_EXTRA_CA_CERTS, value: /etc/lab-ca/ca.crt}
          ports:
            - name: {{ $component }}
              containerPort: {{ if eq $component "terminal" }}7681{{ else }}8080{{ end }}
          readinessProbe:
            httpGet:
              path: {{ if eq $component "terminal" }}/terminal-{{ $participant }}/{{ else }}/healthz{{ end }}
              port: {{ $component }}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: ca, mountPath: /etc/lab-ca, readOnly: true}
            - {name: temporary, mountPath: /tmp}
        {{- end }}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: bastion-{{ . }}}
        - name: ca
          secret: {secretName: lab-ca}
        - name: temporary
          emptyDir: {sizeLimit: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: bastion-{{ . }}
  namespace: {{ $.Release.Namespace }}
spec:
  selector: {app: bastion-{{ . }}}
  ports:
    - {name: terminal, port: 7681, targetPort: 7681}
    - {name: editor, port: 8080, targetPort: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bastion-{{ . }}-browser-only
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app: bastion-{{ . }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: oauth2-proxy}
          podSelector:
            matchLabels: {app: oauth2-proxy}
      ports:
        - {protocol: TCP, port: 7681}
        - {protocol: TCP, port: 8080}
---
{{- end }}
