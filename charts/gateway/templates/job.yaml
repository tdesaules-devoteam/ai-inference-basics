apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-key
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: gateway-credentials
      restartPolicy: Never
      containers:
        - name: initialize-api-key
          image: {{ required "provisionImage is required" .Values.provisionImage | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default "IfNotPresent" }}
          command:
            - python3
            - -c
          args:
            - |
              import json, os, subprocess
              namespace = {{ .Release.Namespace | quote }}
              existing = subprocess.check_output(['kubectl', '-n', namespace, 'get', 'secret', 'lab-api-key', '--ignore-not-found', '-o', 'json'], text=True)
              document = {'apiVersion': 'v1', 'kind': 'Secret', 'type': 'Opaque',
                          'metadata': {'name': 'lab-api-key', 'namespace': namespace},
                          'stringData': {'lab': os.environ['API_BEARER_TOKEN']}}
              if existing.strip():
                  document['metadata'] = json.loads(existing)['metadata']
              subprocess.run(['kubectl', 'replace' if existing.strip() else 'create', '-f', '-'], input=json.dumps(document), text=True, check=True)
              print('Gateway API key preserved or initialized.')
          env:
            - name: API_BEARER_TOKEN
              value: {{ required "apiBearerToken is required" .Values.apiBearerToken | quote }}
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
