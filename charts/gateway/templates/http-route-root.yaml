apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: browser-root
  namespace: {{ .Release.Namespace }}
spec:
  hostnames:
    - {{ required "hostname is required" .Values.hostname | quote }}
  parentRefs:
    - name: ai-inference-basics
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /headlamp/
            statusCode: 302
