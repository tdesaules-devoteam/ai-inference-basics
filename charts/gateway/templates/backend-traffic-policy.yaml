apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: lab-backend-buffers
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-inference-basics
  connection:
    # Multimodal requests include base64 media; this is a connection buffer watermark.
    bufferLimit: {{ .Values.bufferLimit }}
