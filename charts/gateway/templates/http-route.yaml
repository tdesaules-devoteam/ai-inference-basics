apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: browser
  namespace: {{ .Release.Namespace }}
spec:
  hostnames:
    - {{ required "hostname is required" .Values.hostname | quote }}
  parentRefs:
    - name: ai-inference-basics
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /headlamp/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2
        - path:
            type: PathPrefix
            value: /headlamp
        - path:
            type: PathPrefix
            value: /terminal
        - path:
            type: PathPrefix
            value: /code
      backendRefs:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /dex
      backendRefs:
        - name: dex
          namespace: dex
          port: 5556
