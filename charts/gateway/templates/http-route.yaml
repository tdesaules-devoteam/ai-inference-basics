{{- range $route := (include "gateway.browserRoutes" . | fromYamlArray) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: browser-{{ $route.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  hostnames:
    - {{ required "hostname is required" $.Values.hostname | quote }}
  parentRefs:
    - name: ai-inference-basics
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $route.path }}
      backendRefs:
        - name: {{ $route.service }}
          namespace: {{ $route.namespace }}
          port: {{ $route.port }}
{{- end }}
