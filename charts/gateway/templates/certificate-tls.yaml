{{- if not .Values.localHttp }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: lab-tls
  dnsNames:
    - {{ required "hostname is required" .Values.hostname | quote }}
    - ai-inference-basics.gateway.svc.cluster.local
  issuerRef:
    name: lab-ca
    kind: Issuer
{{- end }}
