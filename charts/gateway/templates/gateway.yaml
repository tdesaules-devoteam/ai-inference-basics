apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-inference-basics
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: ai-inference-basics
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: ai-inference-basics
  listeners:
    {{- if .Values.localHttp }}
    - name: http
      port: 80
      protocol: HTTP
    {{- else }}
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: lab-tls
    {{- end }}
      allowedRoutes:
        namespaces:
          from: Same
