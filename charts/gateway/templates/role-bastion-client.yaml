apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bastion-client
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - lab-api-key
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - lab-ca
    verbs:
      - get
