{{- if not .Values.splitModelGateway }}
{{- range $name := .Values.modelNames }}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  schema:
    name: {{ if contains "reranker" $name }}Cohere{{ else }}OpenAI{{ end }}
  backendRef:
    name: {{ $name }}
    kind: Backend
    group: gateway.envoyproxy.io
{{- end }}
{{- end }}
