{{- if .Values.modelNames }}
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: model-api
  namespace: {{ .Release.Namespace }}
spec:
  llmRequestCosts:
    - metadataKey: input_tokens
      type: InputToken
    - metadataKey: output_tokens
      type: OutputToken
    - metadataKey: total_tokens
      type: TotalToken
  hostnames:
    - {{ .Values.hostname | quote }}
    - ai-inference-basics.gateway.svc.cluster.local
  parentRefs:
    - name: ai-inference-basics
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    {{- range $name := .Values.modelNames }}
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: {{ $name }}
      backendRefs:
        - name: {{ $name }}
    {{- end }}
{{- end }}
