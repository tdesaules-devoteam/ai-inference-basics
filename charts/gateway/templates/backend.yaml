{{- if not .Values.splitModelGateway }}
{{- range $name := .Values.modelNames }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  endpoints:
    - fqdn:
        hostname: {{ $name }}-predictor.{{ $name }}.svc.cluster.local
        port: 80
{{- end }}
{{- end }}
