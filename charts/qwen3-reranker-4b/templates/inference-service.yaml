{{- $snapshot := .Files.Get "files/model.lock.json" | fromJson }}
{{- if not (has (int .Values.serving.replicas) (list 0 1)) }}
{{- fail "This lab supports serving.replicas of 0 or 1" }}
{{- end }}
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ .Values.modelName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    serving.kserve.io/deploymentMode: Standard
    serving.kserve.io/autoscalerClass: external
    serving.kserve.io/secretName: model-reader
    serving.kserve.io/stop: {{ eq (int .Values.serving.replicas) 0 | quote }}
spec:
  predictor:
    serviceAccountName: model-reader
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: huggingface
        version: "1"
      runtime: {{ .Values.modelName }}
      protocolVersion: v1
      storageUri: {{ printf "s3://%s/%s/%s/" .Values.bucket .Values.modelName $snapshot.revision | quote }}
      resources:
        requests:
          cpu: "1"
          memory: {{ .Values.requestMemory }}
        limits:
          nvidia.com/gpu: "1"
          nvidia.com/gpumem: {{ .Values.gpuMemoryMiB | quote }}
          nvidia.com/gpucores: {{ .Values.gpuCores | quote }}
          cpu: {{ .Values.threads | quote }}
          memory: {{ .Values.memory }}
