apiVersion: apps/v1
kind: Deployment
metadata:
  name: requester
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: requester
  template:
    metadata:
      labels:
        app: requester
      annotations:
        checksum/collection: {{ include (print $.Template.BasePath "/config-map.yaml") . | sha256sum }}
        checksum/ui: {{ include (print $.Template.BasePath "/config-map-ui.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scalar
          image: {{ .Values.image | quote }}
          env:
            - name: BASE_PATH
              value: /scalar
            - name: CDN_URL
              value: /scalar/scalar.js
            - name: API_REFERENCE_CONFIG
              {{- $config := dict "theme" "none" "forceDarkModeState" "dark" "hideDarkModeToggle" true "customCss" (.Files.Get "files/nord.css") "telemetry" false "withDefaultFonts" false "persistAuth" false "showDeveloperTools" "never" "hideClientButton" true }}
              {{- if .Values.splitModelGateway }}
              {{- $_ := set $config "url" (printf "%s/openapi.json" .Values.modelApiOrigin) }}
              {{- end }}
              value: {{ $config | toJson | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            {{- if .Values.splitModelGateway }}
            - name: ui
              mountPath: /usr/share/caddy/index.html
              subPath: index.html
              readOnly: true
            - name: session
              mountPath: /usr/share/caddy/session
              readOnly: true
            {{- end }}
            - name: docs
              mountPath: /docs
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        {{- if .Values.splitModelGateway }}
        - name: ui
          configMap:
            name: scalar-ui
        - name: session
          secret:
            secretName: lab-api-key
            items:
              - key: lab
                path: token.bin
        {{- end }}
        - name: docs
          configMap:
            name: requester-collection
        - name: tmp
          emptyDir: {}
        - name: config
          emptyDir: {}
        - name: data
          emptyDir: {}
