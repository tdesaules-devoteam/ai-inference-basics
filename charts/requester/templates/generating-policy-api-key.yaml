{{- if .Values.splitModelGateway }}
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: requester-api-key
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - secrets
        resourceNames:
          - lab-api-key
  matchConditions:
    - name: gateway-source
      expression: object.metadata.namespace == "gateway" && has(object.data) && "lab" in object.data
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: lab-api-key
            namespace: {{ .Release.Namespace }}
          type: Opaque
          data:
            lab: (( object.data.lab ))
{{- end }}
