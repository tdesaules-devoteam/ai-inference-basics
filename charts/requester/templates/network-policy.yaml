apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: requester-browser-only
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: requester
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: oauth2-proxy
          podSelector:
            matchLabels:
              app: oauth2-proxy
      ports:
        - protocol: TCP
