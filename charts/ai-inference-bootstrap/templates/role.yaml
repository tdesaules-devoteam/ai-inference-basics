{{- range $ns, $names := .Values.secretNames }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-bootstrap
  namespace: {{ $ns }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
{{ toYaml $names | indent 6 }}
    verbs:
      - get
      - update
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
{{- end }}
