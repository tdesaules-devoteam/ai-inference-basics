apiVersion: v1
kind: ConfigMap
metadata:
  name: model-import
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  import.py: |
{{ .Files.Get "files/import.py" | indent 4 }}
  model.lock.json: |
{{ .Files.Get "files/model.lock.json" | indent 4 }}
  kube.py: |
{{ .Files.Get "files/kube.py" | indent 4 }}
  credentials.py: |
{{ .Files.Get "files/credentials.py" | indent 4 }}
