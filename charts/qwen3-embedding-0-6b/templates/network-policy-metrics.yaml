apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-metrics
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      serving.kserve.io/inferenceservice: {{ .Values.modelName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opentelemetry-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: otel-cluster
      ports:
        - protocol: TCP
          port: 8080
