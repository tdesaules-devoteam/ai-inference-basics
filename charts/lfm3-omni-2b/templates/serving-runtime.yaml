apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: {{ .Values.modelName }}
  namespace: {{ .Release.Namespace }}
spec:
  supportedModelFormats:
    - name: huggingface
      version: "1"
      autoSelect: false
  protocolVersions:
    - v1
  multiModel: false
  containers:
    - name: kserve-container
      image: {{ required "image is required" .Values.image | quote }}
      command:
        - uvicorn
      args:
        - server:app
        - --host
        - 0.0.0.0
        - --port
        - "8080"
        - --no-access-log
        - --limit-concurrency
        - "8"
      env:
        - name: MAX_CONTEXT_TOKENS
          value: {{ .Values.maxModelLen | quote }}
        - name: MODEL_DEVICE
          value: {{ ternary "cuda" "cpu" .Values.gpu.enabled | quote }}
        - name: MODEL_PATH
          value: /mnt/models
        - name: OMP_NUM_THREADS
          value: {{ .Values.threads | quote }}
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: HF_HOME
          value: /tmp/huggingface
      ports:
        - name: http1
          containerPort: 8080
      startupProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
        failureThreshold: 120
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 5
