{{- if .Values.gateway.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: ai-inference-basics
spec:
  {{- if .Values.observability.enabled }}
  telemetry:
    tracing:
      samplingRate: 100
      provider:
        type: OpenTelemetry
        host: telemetry.{{ .Release.Namespace }}.svc.cluster.local
        port: 4317
  {{- end }}
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        container:
          image: {{ .Values.gateway.envoyImage | quote }}
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: https
                  port: 443
                  protocol: TCP
                  targetPort: 10443
                  nodePort: {{ .Values.gateway.nodePort }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: ai-inference-basics
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-inference-basics
spec:
  gatewayClassName: ai-inference-basics
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: ai-inference-basics
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: {{ .Values.gateway.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gateway.tlsSecret }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
