{{- if and .Values.api.enabled .Values.faults.rateLimit }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: lab-rate-limit
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: model-api}
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 1
            unit: Minute
{{- end }}
