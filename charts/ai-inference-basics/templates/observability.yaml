{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
data:
  otelcol-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: collector
              scrape_interval: 15s
              static_configs:
                - targets: [127.0.0.1:8888]
            - job_name: envoy-gateway
              scrape_interval: 15s
              static_configs:
                - targets: [envoy-gateway:19001]
            - job_name: vllm
              scrape_interval: 5s
              static_configs:
                - targets: [ai-inference-basics-chat-kserve-workload-svc:8000, ai-inference-basics-embeddings-predictor:80, ai-inference-basics-rerank-predictor:80]
            {{- if index .Values "dcgm-exporter" "enabled" }}
            - job_name: dcgm
              scrape_interval: 15s
              static_configs:
                - targets: [dcgm-exporter:9400]
            {{- end }}
      filelog:
        include: [/var/log/pods/ai-inference-basics_*/*/*.log]
        start_at: beginning
        include_file_path: true
        operators:
          - type: container
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
        path: /ready
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
        spike_limit_mib: 96
      resource:
        attributes:
          - {key: service.name, value: ai-inference-basics-cluster, action: insert}
      batch:
        timeout: 2s
        send_batch_size: 512
    exporters:
      otlp_http/metrics:
        endpoint: http://127.0.0.1:9090/api/v1/otlp
      otlp_http/logs:
        endpoint: http://127.0.0.1:3100/otlp
      otlp_http/traces:
        endpoint: http://127.0.0.1:4418
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp_http/metrics]
        logs:
          receivers: [otlp, filelog]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp_http/logs]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp_http/traces]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: ai-inference-basics-telemetry}
  template:
    metadata:
      labels: {app: ai-inference-basics-telemetry}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: lgtm
          image: {{ .Values.observability.image | quote }}
          securityContext:
            runAsUser: 0
          env:
            - {name: ENABLE_LOGS_OTELCOL, value: "true"}
            - {name: GF_SERVER_ROOT_URL, value: "https://{{ .Values.gateway.hostname }}:{{ .Values.gateway.nodePort }}/grafana/"}
            - {name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
          resources:
            requests: {cpu: 200m, memory: 768Mi}
            limits: {memory: 3Gi}
          ports:
            - {name: grafana, containerPort: 3000}
            - {name: otlp, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: prometheus, containerPort: 9090}
            - {name: loki, containerPort: 3100}
            - {name: tempo, containerPort: 3200}
          readinessProbe:
            httpGet: {path: /ready, port: 13133}
            initialDelaySeconds: 15
          volumeMounts:
            - {name: config, mountPath: /otel-lgtm/otelcol-config.yaml, subPath: otelcol-config.yaml, readOnly: true}
            - {name: pod-logs, mountPath: /var/log/pods, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap: {name: otel-config}
        - name: pod-logs
          hostPath: {path: /var/log/pods, type: Directory}
        - name: data
          emptyDir: {sizeLimit: 8Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry
spec:
  selector: {app: ai-inference-basics-telemetry}
  ports:
    - {name: grafana, port: 3000, targetPort: grafana}
    - {name: otlp, port: 4317, targetPort: otlp}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: prometheus, port: 9090, targetPort: prometheus}
    - {name: loki, port: 3100, targetPort: loki}
    - {name: tempo, port: 3200, targetPort: tempo}
{{- end }}
