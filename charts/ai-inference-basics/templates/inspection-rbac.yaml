{{- if .Values.access.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-inference-basics-inspection
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list, watch]
  - apiGroups: [serving.kserve.io, gateway.networking.k8s.io, gateway.envoyproxy.io, aigateway.envoyproxy.io]
    resources: ['*']
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-inference-basics-inspection
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ai-inference-basics-inspection}
subjects:
  - {kind: ServiceAccount, name: headlamp, namespace: {{ .Release.Namespace }}}
  {{- range .Values.workspaces.participants }}
  - {kind: ServiceAccount, name: workspace-{{ . }}, namespace: {{ $.Release.Namespace }}}
  {{- end }}
{{- end }}
