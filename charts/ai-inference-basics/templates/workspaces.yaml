{{- if .Values.workspaces.enabled }}
{{- $image := required "workspaces.image must contain a qualified image digest" .Values.workspaces.image }}
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-http
  namespace: demo
data:
  Caddyfile: |
    :8080 {
      respond "AI Inference Basics preview is working" 200
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: ai-inference-basics-demo}
  template:
    metadata:
      labels: {app: ai-inference-basics-demo}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: http
          image: {{ .Values.workspaces.caddyImage | quote }}
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/caddy, readOnly: true}
      volumes:
        - name: config
          configMap: {name: demo-http}
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: demo
spec:
  selector: {app: ai-inference-basics-demo}
  ports: [{name: http, port: 80, targetPort: http}]
{{- range .Values.workspaces.participants }}
{{- if $.Values.workspaces.installerMode }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: installer-{{ . }}
  labels:
    ai-inference-basics.dev/privilege: temporary-workshop-installer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-inference-basics-installer-{{ . }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin}
subjects:
  - {kind: ServiceAccount, name: installer-{{ . }}, namespace: {{ $.Release.Namespace }}}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-{{ . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-inference-basics-workspace-{{ . }}-view
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects:
  - {kind: ServiceAccount, name: workspace-{{ . }}, namespace: {{ $.Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-{{ . }}-preview
  namespace: demo
rules:
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-{{ . }}-preview
  namespace: demo
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: workspace-{{ . }}-preview}
subjects:
  - {kind: ServiceAccount, name: workspace-{{ . }}, namespace: {{ $.Release.Namespace }}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workspace-{{ . }}
data:
  {{- include "ai-inference-basics.workspaceConfig" (dict "participant" .) | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-{{ . }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: workspace-{{ . }}}
  template:
    metadata:
      labels: {app: workspace-{{ . }}}
      annotations:
        checksum/config: {{ include "ai-inference-basics.workspaceConfig" (dict "participant" .) | sha256sum }}
    spec:
      serviceAccountName: {{ if $.Values.workspaces.installerMode }}installer-{{ . }}{{ else }}workspace-{{ . }}{{ end }}
      securityContext:
        fsGroup: 1000
      containers:
        - name: terminal
          image: {{ $image | quote }}
          imagePullPolicy: {{ $.Values.workspaces.imagePullPolicy }}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 512Mi}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: config, mountPath: /etc/zellij, readOnly: true}
        - name: preview
          image: {{ $.Values.workspaces.caddyImage | quote }}
          ports: [{name: preview, containerPort: 8080}, {name: terminal, containerPort: 8081}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/caddy, readOnly: true}
      volumes:
        - name: workspace
          emptyDir: {}
        - name: config
          configMap: {name: workspace-{{ . }}}
---
apiVersion: v1
kind: Service
metadata:
  name: workspace-{{ . }}
spec:
  selector: {app: workspace-{{ . }}}
  ports:
    - {name: terminal, port: 7681, targetPort: terminal}
    - {name: preview, port: 8080, targetPort: preview}
{{- end }}
{{- end }}
