{{- if .Values.api.enabled }}
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: model-api
spec:
  hostnames: [{{ .Values.gateway.hostname | quote }}]
  parentRefs:
    - {name: ai-inference-basics, kind: Gateway, group: gateway.networking.k8s.io}
  rules:
    {{- range $name := list "chat" "embeddings" "rerank" }}
    - matches:
        - headers:
            - {type: Exact, name: x-ai-eg-model, value: ai-inference-basics-{{ $name }}}
      backendRefs:
        - name: ai-inference-basics-{{ $name }}
    {{- end }}
{{- range $name := list "chat" "embeddings" "rerank" }}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: ai-inference-basics-{{ $name }}
spec:
  schema:
    name: {{ if eq $name "rerank" }}Cohere{{ else }}OpenAI{{ end }}
  backendRef:
    name: ai-inference-basics-{{ $name }}
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: ai-inference-basics-{{ $name }}
spec:
  endpoints:
    - fqdn:
        hostname: {{ if eq $name "chat" }}ai-inference-basics-chat-kserve-workload-svc{{ else }}ai-inference-basics-{{ $name }}-predictor{{ end }}.{{ $.Release.Namespace }}.svc.cluster.local
        port: {{ if eq $name "chat" }}8000{{ else }}80{{ end }}
{{- end }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: model-api-key
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: model-api}
  apiKeyAuth:
    credentialRefs:
      - {group: "", kind: Secret, name: {{ .Values.api.existingSecret }}}
    extractFrom:
      - headers: [Authorization]
{{- end }}
