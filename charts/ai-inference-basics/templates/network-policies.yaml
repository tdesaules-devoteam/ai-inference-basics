{{- if .Values.access.enabled }}
{{- range $name := list "headlamp" "dex" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: protect-{{ $name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: ai-inference-basics-oauth}
        {{- if eq $name "dex" }}
        - podSelector:
            matchLabels: {gateway.envoyproxy.io/owning-gateway-name: ai-inference-basics}
        {{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: protect-oauth
spec:
  podSelector:
    matchLabels: {app: ai-inference-basics-oauth}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {gateway.envoyproxy.io/owning-gateway-name: ai-inference-basics}
      ports: [{port: 4180, protocol: TCP}]
{{- if .Values.workspaces.enabled }}
{{- range .Values.workspaces.participants }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: protect-workspace-{{ . }}
spec:
  podSelector:
    matchLabels: {app: workspace-{{ . }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: ai-inference-basics-oauth}
      ports:
        - {port: 8081, protocol: TCP}
        - {port: 8080, protocol: TCP}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.models.enabled }}
{{- range $name := list "chat" "embeddings" "rerank" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: protect-model-{{ $name }}
spec:
  podSelector:
    matchLabels:
      {{- if eq $name "chat" }}
      app.kubernetes.io/name: ai-inference-basics-chat
      app.kubernetes.io/component: llminferenceservice-workload
      {{- else }}
      serving.kserve.io/inferenceservice: ai-inference-basics-{{ $name }}
      {{- end }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {gateway.envoyproxy.io/owning-gateway-name: ai-inference-basics}
        - podSelector:
            matchLabels: {app: ai-inference-basics-telemetry}
      ports: [{port: {{ if eq $name "chat" }}8000{{ else }}8080{{ end }}, protocol: TCP}]
{{- end }}
{{- end }}
{{- if .Values.observability.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: protect-telemetry
spec:
  podSelector:
    matchLabels: {app: ai-inference-basics-telemetry}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: ai-inference-basics-oauth}}
      ports: [{port: 3000, protocol: TCP}]
    - from:
        - podSelector: {}
      ports:
        - {port: 4317, protocol: TCP}
        - {port: 4318, protocol: TCP}
    - from:
        - podSelector: {matchLabels: {app: ai-inference-basics-telemetry}}
{{- end }}
