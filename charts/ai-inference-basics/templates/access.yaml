{{- if .Values.access.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels: {app: ai-inference-basics-oauth}
  template:
    metadata:
      labels: {app: ai-inference-basics-oauth}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: oauth2-proxy
          image: {{ .Values.access.oauthImage | quote }}
          args: ["--config=/etc/oauth/oauth2-proxy.cfg"]
          ports:
            - {name: http, containerPort: 4180}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /ready, port: http}
          volumeMounts:
            - {name: config, mountPath: /etc/oauth, readOnly: true}
            - {name: ca, mountPath: /etc/ai-inference-basics-ca, readOnly: true}
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.access.existingSecret }}
        - name: ca
          secret:
            secretName: ai-inference-basics-ca
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
spec:
  selector: {app: ai-inference-basics-oauth}
  ports:
    - {name: http, port: 4180, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: browser
spec:
  parentRefs:
    - name: ai-inference-basics
  hostnames: [{{ .Values.gateway.hostname | quote }}]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /dex}
      backendRefs:
        - {name: dex, port: 5556}
    - matches:
        - path: {type: PathPrefix, value: /oauth2}
        - path: {type: PathPrefix, value: /headlamp}
        - path: {type: PathPrefix, value: /terminal-a}
        - path: {type: PathPrefix, value: /terminal-b}
        - path: {type: PathPrefix, value: /preview-a}
        - path: {type: PathPrefix, value: /preview-b}
        - path: {type: PathPrefix, value: /grafana}
      backendRefs:
        - {name: oauth2-proxy, port: 4180}
    - matches:
        - path: {type: Exact, value: /}
      filters:
        - type: RequestRedirect
          requestRedirect:
            path: {type: ReplaceFullPath, replaceFullPath: /headlamp/}
            statusCode: 302
{{- end }}
