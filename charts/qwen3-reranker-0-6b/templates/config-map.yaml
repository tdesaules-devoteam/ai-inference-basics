apiVersion: v1
kind: ConfigMap
metadata:
  name: model-import
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    # The pre-install import Job needs both files before ordinary chart resources exist.
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  import.py: |
{{ .Files.Get "files/import.py" | indent 4 }}
  model.lock.json: |
{{ .Files.Get "files/model.lock.json" | indent 4 }}
