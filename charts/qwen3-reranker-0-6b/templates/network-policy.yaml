apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-apis-gateway-only
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: serving.kserve.io/inferenceservice
        operator: Exists
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ ternary "agentgateway" "gateway" (.Values.splitModelGateway | default false) }}
          podSelector:
            matchLabels:
              {{- if .Values.splitModelGateway }}
              app.kubernetes.io/instance: agentgateway
              {{- else }}
              gateway.envoyproxy.io/owning-gateway-name: ai-inference-basics
              {{- end }}
      ports:
        - protocol: TCP
          port: 8080
