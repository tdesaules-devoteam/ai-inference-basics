apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - model-reader
      - model-writer
    verbs:
      - get
      - update
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
