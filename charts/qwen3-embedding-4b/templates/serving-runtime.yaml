apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: {{ .Values.modelName }}
  namespace: {{ $.Release.Namespace }}
spec:
  supportedModelFormats:
    - name: huggingface
      version: "1"
      autoSelect: false
  protocolVersions:
    - v1
  multiModel: false
  containers:
    - name: kserve-container
      image: {{ $.Values.image | quote }}
      command:
        - vllm
      args:
        - serve
        - /mnt/models
        - --served-model-name
        - {{ .Values.modelName }}
        - --port
        - "8080"
        - --otlp-traces-endpoint
        - http://otel-cluster.opentelemetry-collector.svc.cluster.local:4317
        - --max-model-len
        - {{ $.Values.maxModelLen | quote }}
        - --dtype
        - bfloat16
        - --max-num-seqs
        - "2"
        - --gpu-memory-utilization
        - "0.80"
        {{- if eq .Values.task "chat" }}
        - --enable-prefix-caching
        {{- else }}
        - --runner
        - pooling
        {{- end }}
        {{- if eq .Values.task "rerank" }}
        - --convert
        - classify
        - --hf-overrides
        - '{"architectures":["Qwen3ForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'
        {{- end }}
      env:
        - name: OTEL_SERVICE_NAME
          value: vllm
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: {{ printf "service.namespace=%s" .Release.Namespace | quote }}
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
        - name: HF_HUB_DISABLE_TELEMETRY
          value: "1"
      ports:
        - name: http1
          containerPort: 8080
      startupProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
        failureThreshold: 120
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 5
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
