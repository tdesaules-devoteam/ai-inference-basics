apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: ai-inference-basics
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        container:
          image: {{ .Values.envoyImage | quote }}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
      envoyService:
        name: ai-inference-basics
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: https
                  port: 443
                  protocol: TCP
                  targetPort: 10443
                  nodePort: {{ .Values.nodePort }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: ai-inference-basics
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-inference-basics
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: ai-inference-basics
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: ai-inference-basics
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: lab-tls
      allowedRoutes:
        namespaces: {from: Same}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: browser
  namespace: {{ .Release.Namespace }}
spec:
  hostnames: [{{ required "hostname is required" .Values.hostname | quote }}]
  parentRefs: [{name: ai-inference-basics}]
  rules:
    - matches:
        - path: {type: Exact, value: /}
      filters:
        - type: RequestRedirect
          requestRedirect:
            path: {type: ReplaceFullPath, replaceFullPath: /headlamp/}
            statusCode: 302
    - matches:
        - path: {type: PathPrefix, value: /oauth2}
        - path: {type: PathPrefix, value: /headlamp}
        - path: {type: PathPrefix, value: /terminal-a}
        - path: {type: PathPrefix, value: /terminal-b}
        - path: {type: PathPrefix, value: /code-a}
        - path: {type: PathPrefix, value: /code-b}
      backendRefs:
        - {name: oauth2-proxy, namespace: oauth2-proxy, port: 80}
    - matches:
        - path: {type: PathPrefix, value: /dex}
      backendRefs:
        - {name: dex, namespace: dex, port: 5556}
{{- range $backend := list (dict "namespace" "oauth2-proxy" "name" "oauth2-proxy") (dict "namespace" "dex" "name" "dex") }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: lab-gateway
  namespace: {{ $backend.namespace }}
spec:
  from:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: {{ $.Release.Namespace }}}
  to:
    - {group: "", kind: Service, name: {{ $backend.name }}}
{{- end }}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: model-api
  namespace: {{ .Release.Namespace }}
spec:
  hostnames:
    - {{ .Values.hostname | quote }}
    - ai-inference-basics.gateway.svc.cluster.local
  parentRefs:
    - {name: ai-inference-basics, kind: Gateway, group: gateway.networking.k8s.io}
  rules:
    {{- range $name := list "chat" "embeddings" "rerank" }}
    - matches:
        - headers:
            - {type: Exact, name: x-ai-eg-model, value: ai-inference-basics-{{ $name }}}
      backendRefs:
        - name: ai-inference-basics-{{ $name }}
    {{- end }}
{{- range $name := list "chat" "embeddings" "rerank" }}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: ai-inference-basics-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  schema:
    name: {{ if eq $name "rerank" }}Cohere{{ else }}OpenAI{{ end }}
  backendRef:
    name: ai-inference-basics-{{ $name }}
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: ai-inference-basics-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  endpoints:
    - fqdn:
        hostname: ai-inference-basics-{{ $name }}-predictor.inference-service.svc.cluster.local
        port: 80
{{- end }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: model-api-key
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: model-api}
  apiKeyAuth:
    credentialRefs:
      - {group: "", kind: Secret, name: lab-api-key}
    extractFrom:
      - headers: [Authorization]
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: lab-backend-buffers
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: ai-inference-basics}
  connection:
    # Embeddings and ttyd's embedded assets exceed the default 32-KiB buffer.
    bufferLimit: 2Mi
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: lab-buffers
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: ai-inference-basics}
  connection:
    bufferLimit: 2Mi
