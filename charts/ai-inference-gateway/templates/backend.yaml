{{- range $name := list "chat" "embeddings" "rerank" }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: ai-inference-basics-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  endpoints:
    - fqdn:
        hostname: ai-inference-basics-{{ $name }}-predictor.inference-service.svc.cluster.local
        port: 80
{{- end }}
