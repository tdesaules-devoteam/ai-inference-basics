apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-apis-gateway-only
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: serving.kserve.io/inferenceservice
        operator: Exists
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: gateway}
          podSelector:
            matchLabels: {gateway.envoyproxy.io/owning-gateway-name: ai-inference-basics}
      ports:
        - {protocol: TCP, port: 8080}
