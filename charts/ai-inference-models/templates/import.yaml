apiVersion: v1
kind: ConfigMap
metadata:
  name: model-import
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  import.py: |
{{ .Files.Get "files/import.py" | indent 4 }}
  models.lock.json: |
{{ .Files.Get "files/models.lock.json" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: model-import
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: import
          image: {{ required "toolsImage is required" .Values.toolsImage | quote }}
          imagePullPolicy: {{ .Values.toolsImagePullPolicy | default "IfNotPresent" }}
          command: [python3, /scripts/import.py]
          env:
            - name: S3_ENDPOINT
              value: {{ .Values.endpoint | quote }}
            - name: S3_BUCKET
              value: {{ .Values.bucket | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: model-writer, key: AWS_ACCESS_KEY_ID}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: model-writer, key: AWS_SECRET_ACCESS_KEY}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: cache, mountPath: /cache}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: scripts
          configMap: {name: model-import}
        - name: cache
          emptyDir: {sizeLimit: 3Gi}
