apiVersion: v1
kind: ConfigMap
metadata:
  name: model-import
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  import.py: |
{{ .Files.Get "files/import.py" | indent 4 }}
  models.lock.json: |
{{ .Files.Get "files/models.lock.json" | indent 4 }}
