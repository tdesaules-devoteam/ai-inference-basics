apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgateway-listeners
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: agentgateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opentelemetry-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: otel-cluster
      ports:
        - protocol: TCP
          port: 15020
