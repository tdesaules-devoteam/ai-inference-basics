name: Tag tested images
description: Create the annotated release tag carrying both verified OCI digests
inputs:
  version: {description: Planned stable version, required: true}
  bastion: {description: Verified published bastion digest, required: true}
  provision: {description: Verified published provision digest, required: true}
runs:
  using: docker
  image: Dockerfile
  env:
    VERSION: ${{ inputs.version }}
    BASTION_DIGEST: ${{ inputs.bastion }}
    PROVISION_DIGEST: ${{ inputs.provision }}
