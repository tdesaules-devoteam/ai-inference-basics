name: release
'on':
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      images-only:
        description: Publish qualified application images without creating a Git tag or GitHub Release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      has_build: ${{ steps.plan.outputs.has_build }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
      images: ${{ steps.plan.outputs.images }}
      digests: ${{ steps.plan.outputs.digests }}
      shell_files: ${{ steps.files.outputs.shellcheck-files }}
      markdown_files: ${{ steps.files.outputs.markdownlint-files }}
      yaml_files: ${{ steps.files.outputs.yaml-files }}
      container_files: ${{ steps.files.outputs.hadolint-files }}
      version: ${{ steps.version.outputs.release-version }}
      changed: ${{ steps.version.outputs.release-changed }}
      build_images: ${{ steps.plan.outputs.build_images }}
      scan_only: ${{ steps.plan.outputs.scan_only }}
      reused: ${{ steps.plan.outputs.reused }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed source files
        id: files
        uses: tdesaules/github-actions/workflow/get-changed-files@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          before: ${{ github.event.before }}
          after: ${{ github.sha }}
          full: 'true'
      - name: Select application images and published digests
        id: plan
        uses: tdesaules/github-actions/workflow/get-image-matrix@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          application-definition: infra/infra-definition.sample.json
          event: ${{ github.event_name }}
          ref: ${{ github.ref }}
          files: ${{ steps.files.outputs.files }}
          full: ${{ steps.files.outputs.full }}
      - uses: tdesaules/github-actions/workflow/new-release-plan@be037a8ee89b4431dde66fe72c482b5e9c66d137
        id: version
        if: github.event_name == 'workflow_dispatch' && !inputs.images-only
  lint:
    needs:
      - check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate shell
        uses: tdesaules/github-actions/lint/shellcheck@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          files: ${{ needs.check.outputs.shell_files }}
      - name: Validate YAML
        uses: tdesaules/github-actions/lint/yaml@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          files: ${{ needs.check.outputs.yaml_files }}
      - name: Validate documentation
        uses: tdesaules/github-actions/lint/markdownlint@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          files: ${{ needs.check.outputs.markdown_files }}
      - name: Validate workflows
        uses: tdesaules/github-actions/lint/actionlint@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          files: '[".github/workflows/main.yml", ".github/workflows/release.yml", ".github/workflows/maintenance.yml"]'
      - name: Validate Helm
        uses: tdesaules/github-actions/check/test-helmfile@be037a8ee89b4431dde66fe72c482b5e9c66d137
      - name: Validate Containerfiles
        uses: tdesaules/github-actions/lint/hadolint@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          files: ${{ needs.check.outputs.container_files }}
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.check.outputs.build_images) }}
    needs:
      - check
      - lint
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.lint.result == 'success' && needs.check.outputs.has_build == 'true' && (inputs.images-only
      || needs.check.outputs.changed == 'true') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: tdesaules/github-actions/oci/build-image@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          containerfile: oci/${{ matrix.image }}/Containerfile
          image: localhost/${{ matrix.image }}
          version: ${{ github.sha }}
          platform: linux/amd64
          output: dist/image.oci.tar
          context: .
        id: build
      - uses: tdesaules/github-actions/workflow/new-build-receipt@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          archive: dist/image.oci.tar
          output: dist/build.json
          expected-sha256: ${{ steps.build.outputs.archive-sha256 }}
          image: ${{ matrix.image }}
          architecture: amd64
          revision: ${{ github.sha }}
          version: ${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-${{ matrix.image }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.check.outputs.images) }}
    needs:
      - check
      - lint
      - build
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.lint.result == 'success' && needs.check.outputs.has_tests == 'true' && ((needs.check.outputs.has_build
      == 'true' && needs.build.result == 'success') || (needs.check.outputs.has_build == 'false' && needs.build.result == 'skipped')) && (github.ref_type
      == 'tag' || inputs.images-only || needs.check.outputs.changed == 'true') }}
    services:
      candidate-registry:
        image: ghcr.io/tdesaules/github-actions/workflow-start-test-registry@sha256:e428ed0f7c5a8d1f9062a041aeeeddbfeb86cf11dcaf8f24a83a4d55173bbb8a
        ports:
          - 5000/tcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build-${{ matrix.image }}
          path: dist
        if: contains(fromJSON(needs.check.outputs.build_images), matrix.image)
      - uses: tdesaules/github-actions/workflow/test-build-artifact@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          archive: dist/image.oci.tar
          receipt: dist/build.json
          image: ${{ matrix.image }}
          architecture: amd64
          revision: ${{ github.sha }}
          version: ${{ github.sha }}
        if: contains(fromJSON(needs.check.outputs.build_images), matrix.image)
      - uses: tdesaules/github-actions/workflow/import-candidate-image@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          archive: dist/image.oci.tar
          repository: ${{ matrix.image }}
          host-port: ${{ job.services.candidate-registry.ports['5000'] }}
        id: candidate
        if: contains(fromJSON(needs.check.outputs.build_images), matrix.image)
      - uses: tdesaules/github-actions/oci/get-image-digest@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          image: ghcr.io/${{ github.repository }}/${{ matrix.image }}@${{ fromJSON(needs.check.outputs.digests)[matrix.image] }}
          expected-digest: ${{ fromJSON(needs.check.outputs.digests)[matrix.image] }}
        id: published
        if: ${{ !contains(fromJSON(needs.check.outputs.build_images), matrix.image) }}
      - uses: tdesaules/github-actions/workflow/new-candidate-action@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          image: ${{ steps.candidate.outputs.image || steps.published.outputs.reference }}
          destination: .candidate
          application-smoke: ${{ matrix.image }}
        if: ${{ !contains(fromJSON(needs.check.outputs.scan_only), matrix.image) }}
      # Execute the candidate itself before its build receipt can be promoted to tested.
      - uses: ./.candidate
      - uses: tdesaules/github-actions/workflow/test-build-artifact@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          archive: dist/image.oci.tar
          receipt: dist/build.json
          image: ${{ matrix.image }}
          architecture: amd64
          revision: ${{ github.sha }}
          version: ${{ github.sha }}
          qualification: dist/qualified.json
          tested-digest: ${{ steps.candidate.outputs.digest }}
        if: contains(fromJSON(needs.check.outputs.build_images), matrix.image)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-${{ matrix.image }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
        if: contains(fromJSON(needs.check.outputs.build_images), matrix.image)
      - uses: tdesaules/github-actions/oci/new-sbom@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          source: ${{ steps.published.outputs.reference && format('registry:{0}', steps.published.outputs.reference) || 'oci-archive:dist/image.oci.tar'
            }}
        continue-on-error: true
        id: sbom
      - uses: tdesaules/github-actions/oci/test-vulnerabilities@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          sbom: sbom.spdx.json
          fail-on: none
        continue-on-error: true
        id: scan
      - uses: tdesaules/github-actions/workflow/summarize-security@be037a8ee89b4431dde66fe72c482b5e9c66d137
        continue-on-error: true
        with:
          subject: git:${{ github.sha }}
          sbom-outcome: ${{ steps.sbom.outcome }}
          scan-outcome: ${{ steps.scan.outcome }}
          sbom: sbom.spdx.json
          report: grype.json
          output: security.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: advisory-${{ matrix.image }}
          path: |-
            sbom.spdx.json
            grype.json
            security.json
          if-no-files-found: warn
        continue-on-error: true
      - uses: tdesaules/github-actions/oci/test-image-signature@be037a8ee89b4431dde66fe72c482b5e9c66d137
        if: github.ref_type == 'tag'
        continue-on-error: true
        with:
          image: ${{ steps.published.outputs.reference }}
          identity: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
          issuer: https://token.actions.githubusercontent.com
  release:
    runs-on: ubuntu-24.04
    needs:
      - check
      - lint
      - build
      - test
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.lint.result == 'success' && needs.check.outputs.has_tests == 'true' && ((needs.check.outputs.has_build
      == 'true' && needs.build.result == 'success') || (needs.check.outputs.has_build == 'false' && needs.build.result == 'skipped')) && needs.test.result
      == 'success' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - if: ${{ !inputs.images-only }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ai-inference-basics
        id: bot
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token || github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualified-bastion
          path: dist/bastion
        if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON(needs.check.outputs.build_images), 'bastion') }}
      - uses: tdesaules/github-actions/workflow/test-build-artifact@be037a8ee89b4431dde66fe72c482b5e9c66d137
        id: verified-bastion
        if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON(needs.check.outputs.build_images), 'bastion') }}
        with:
          archive: dist/bastion/image.oci.tar
          receipt: dist/bastion/build.json
          image: bastion
          architecture: amd64
          revision: ${{ github.sha }}
          version: ${{ github.sha }}
          qualification: dist/bastion/qualified.json
      - uses: tdesaules/github-actions/oci/publish-image@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          source: oci-archive:dist/bastion/image.oci.tar
          destination: docker://ghcr.io/${{ github.repository }}/bastion:sha-${{ github.sha }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
        if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON(needs.check.outputs.build_images), 'bastion') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualified-provision
          path: dist/provision
        if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON(needs.check.outputs.build_images), 'provision') }}
      - uses: tdesaules/github-actions/workflow/test-build-artifact@be037a8ee89b4431dde66fe72c482b5e9c66d137
        id: verified-provision
        if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON(needs.check.outputs.build_images), 'provision') }}
        with:
          archive: dist/provision/image.oci.tar
          receipt: dist/provision/build.json
          image: provision
          architecture: amd64
          revision: ${{ github.sha }}
          version: ${{ github.sha }}
          qualification: dist/provision/qualified.json
      - uses: tdesaules/github-actions/oci/publish-image@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          source: oci-archive:dist/provision/image.oci.tar
          destination: docker://ghcr.io/${{ github.repository }}/provision:sha-${{ github.sha }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
        if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON(needs.check.outputs.build_images), 'provision') }}
      - uses: tdesaules/github-actions/oci/get-image-digest@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          image: ghcr.io/${{ github.repository }}/bastion:sha-${{ github.sha }}
          expected-digest: ${{ steps.verified-bastion.outputs.digest }}
        id: bastion
        if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON(needs.check.outputs.build_images), 'bastion') }}
      - name: Sign bastion
        uses: tdesaules/github-actions/oci/new-image-signature@be037a8ee89b4431dde66fe72c482b5e9c66d137
        if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON(needs.check.outputs.build_images), 'bastion') }}
        continue-on-error: true
        with:
          image: ${{ steps.bastion.outputs.reference }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
      - uses: tdesaules/github-actions/oci/get-image-digest@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          image: ghcr.io/${{ github.repository }}/provision:sha-${{ github.sha }}
          expected-digest: ${{ steps.verified-provision.outputs.digest }}
        id: provision
        if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON(needs.check.outputs.build_images), 'provision') }}
      - name: Sign provision
        uses: tdesaules/github-actions/oci/new-image-signature@be037a8ee89b4431dde66fe72c482b5e9c66d137
        if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON(needs.check.outputs.build_images), 'provision') }}
        continue-on-error: true
        with:
          image: ${{ steps.provision.outputs.reference }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
      - uses: tdesaules/github-actions/workflow/complete-release@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          token: ${{ steps.bot.outputs.token }}
          application-version: ${{ needs.check.outputs.version }}
          application-reused: ${{ needs.check.outputs.reused }}
          application-digests: '{"bastion":"${{ steps.bastion.outputs.digest || fromJSON(needs.check.outputs.reused).bastion }}","provision":"${{ steps.provision.outputs.digest
            || fromJSON(needs.check.outputs.reused).provision }}"}'
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.images-only }}
      - uses: tdesaules/github-actions/workflow/new-github-release@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          notes: docs/release-notes.md
          token: ${{ steps.bot.outputs.token }}
        if: ${{ github.ref_type == 'tag' }}
