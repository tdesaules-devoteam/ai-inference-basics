name: release
'on':
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      images-only:
        description: Publish qualified application images without creating a Git tag or GitHub Release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      has_build: ${{ steps.plan.outputs.has_build }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
      images: ${{ steps.plan.outputs.images }}
      digests: ${{ steps.plan.outputs.digests }}
      shell_files: ${{ steps.plan.outputs.shell_files }}
      markdown_files: ${{ steps.plan.outputs.markdown_files }}
      yaml_files: ${{ steps.plan.outputs.yaml_files }}
      container_files: ${{ steps.plan.outputs.container_files }}
      version: ${{ steps.version.outputs.release-version }}
      changed: ${{ steps.version.outputs.release-changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/check
        id: plan
      - uses: tdesaules/github-actions/workflow/new-release-plan@e00720678192c53c13a0ba37fccd5349ea755068
        id: version
        if: github.event_name == 'workflow_dispatch' && !inputs.images-only
  lint:
    needs:
      - check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate shell
        uses: tdesaules/github-actions/lint/shellcheck@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          files: ${{ needs.check.outputs.shell_files }}
      - name: Validate YAML
        uses: tdesaules/github-actions/lint/yaml@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          files: ${{ needs.check.outputs.yaml_files }}
      - name: Validate documentation
        uses: tdesaules/github-actions/lint/markdownlint@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          files: ${{ needs.check.outputs.markdown_files }}
      - name: Validate workflows
        uses: tdesaules/github-actions/lint/actionlint@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          files: '[".github/workflows/main.yml", ".github/workflows/release.yml", ".github/workflows/maintenance.yml"]'
      - name: Validate Helm
        uses: ./.github/actions/lint-helm
      - name: Validate Containerfiles
        uses: tdesaules/github-actions/lint/hadolint@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          files: ${{ needs.check.outputs.container_files }}
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.check.outputs.images) }}
    needs:
      - check
      - lint
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.lint.result == 'success' && needs.check.outputs.has_build == 'true' && (inputs.images-only || needs.check.outputs.changed
      == 'true') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: tdesaules/github-actions/oci/build-image@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          containerfile: oci/${{ matrix.image }}/Containerfile
          image: localhost/${{ matrix.image }}
          version: ${{ github.sha }}
          platform: linux/amd64
          output: dist/image.oci.tar
        id: build
      - uses: tdesaules/github-actions/workflow/new-build-receipt@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          archive: dist/image.oci.tar
          output: dist/build.json
          expected-sha256: ${{ steps.build.outputs.archive-sha256 }}
          image: ${{ matrix.image }}
          architecture: amd64
          revision: ${{ github.sha }}
          version: ${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-${{ matrix.image }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.check.outputs.images) }}
    needs:
      - check
      - lint
      - build
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.lint.result == 'success' && needs.check.outputs.has_tests == 'true' && (needs.build.result
      == 'success' || (github.ref_type == 'tag' && needs.build.result == 'skipped')) }}
    services:
      candidate-registry:
        image: ghcr.io/tdesaules/github-actions/workflow-start-test-registry@sha256:e428ed0f7c5a8d1f9062a041aeeeddbfeb86cf11dcaf8f24a83a4d55173bbb8a
        ports:
          - 5000/tcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build-${{ matrix.image }}
          path: dist
        if: github.event_name == 'workflow_dispatch'
      - uses: tdesaules/github-actions/workflow/test-build-artifact@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          archive: dist/image.oci.tar
          receipt: dist/build.json
          image: ${{ matrix.image }}
          architecture: amd64
          revision: ${{ github.sha }}
          version: ${{ github.sha }}
        if: github.event_name == 'workflow_dispatch'
      - uses: tdesaules/github-actions/workflow/import-candidate-image@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          archive: dist/image.oci.tar
          repository: ${{ matrix.image }}
          host-port: ${{ job.services.candidate-registry.ports['5000'] }}
        id: candidate
        if: github.event_name == 'workflow_dispatch'
      - uses: tdesaules/github-actions/oci/get-image-digest@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          image: ghcr.io/${{ github.repository }}/${{ matrix.image }}@${{ fromJSON(needs.check.outputs.digests)[matrix.image] }}
          expected-digest: ${{ fromJSON(needs.check.outputs.digests)[matrix.image] }}
        id: published
        if: github.ref_type == 'tag'
      - uses: tdesaules/github-actions/workflow/new-candidate-action@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          directory: .github/actions/smoke-${{ matrix.image }}
          image: ${{ steps.candidate.outputs.image || steps.published.outputs.reference }}
          destination: .candidate
      - uses: ./.candidate
      - uses: ./.github/actions/record-qualification
        with:
          image: ${{ matrix.image }}
          digest: ${{ steps.candidate.outputs.digest }}
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-${{ matrix.image }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
        if: github.event_name == 'workflow_dispatch'
      - uses: tdesaules/github-actions/oci/new-sbom@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          source: ${{ github.ref_type == 'tag' && format('registry:{0}', steps.published.outputs.reference) || 'oci-archive:dist/image.oci.tar' }}
        continue-on-error: true
        id: sbom
      - uses: tdesaules/github-actions/oci/test-vulnerabilities@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          sbom: sbom.spdx.json
          fail-on: none
        continue-on-error: true
        id: scan
      - uses: tdesaules/github-actions/workflow/summarize-security@e00720678192c53c13a0ba37fccd5349ea755068
        continue-on-error: true
        with:
          subject: git:${{ github.sha }}
          sbom-outcome: ${{ steps.sbom.outcome }}
          scan-outcome: ${{ steps.scan.outcome }}
          sbom: sbom.spdx.json
          report: grype.json
          output: security.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: advisory-${{ matrix.image }}
          path: |-
            sbom.spdx.json
            grype.json
            security.json
          if-no-files-found: warn
        continue-on-error: true
      - uses: tdesaules/github-actions/oci/test-image-signature@e00720678192c53c13a0ba37fccd5349ea755068
        if: github.ref_type == 'tag'
        continue-on-error: true
        with:
          image: ${{ steps.published.outputs.reference }}
          identity: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
          issuer: https://token.actions.githubusercontent.com
  release:
    runs-on: ubuntu-24.04
    needs:
      - check
      - lint
      - build
      - test
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.lint.result == 'success' && needs.check.outputs.has_tests == 'true' && (needs.build.result
      == 'success' || (github.ref_type == 'tag' && needs.build.result == 'skipped')) && needs.test.result == 'success' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - if: ${{ !inputs.images-only }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ai-inference-basics
        id: bot
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token || github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualified-bastion
          path: dist/bastion
        if: github.event_name == 'workflow_dispatch'
      - uses: tdesaules/github-actions/workflow/test-build-artifact@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          archive: dist/bastion/image.oci.tar
          receipt: dist/bastion/build.json
          image: bastion
          architecture: amd64
          revision: ${{ github.sha }}
          version: ${{ github.sha }}
        if: github.event_name == 'workflow_dispatch'
      - uses: ./.github/actions/read-qualification
        id: verified-bastion
        if: github.event_name == 'workflow_dispatch'
        with:
          image: bastion
      - uses: tdesaules/github-actions/oci/publish-image@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          source: oci-archive:dist/bastion/image.oci.tar
          destination: docker://ghcr.io/${{ github.repository }}/bastion:sha-${{ github.sha }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualified-provision
          path: dist/provision
        if: github.event_name == 'workflow_dispatch'
      - uses: tdesaules/github-actions/workflow/test-build-artifact@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          archive: dist/provision/image.oci.tar
          receipt: dist/provision/build.json
          image: provision
          architecture: amd64
          revision: ${{ github.sha }}
          version: ${{ github.sha }}
        if: github.event_name == 'workflow_dispatch'
      - uses: ./.github/actions/read-qualification
        id: verified-provision
        if: github.event_name == 'workflow_dispatch'
        with:
          image: provision
      - uses: tdesaules/github-actions/oci/publish-image@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          source: oci-archive:dist/provision/image.oci.tar
          destination: docker://ghcr.io/${{ github.repository }}/provision:sha-${{ github.sha }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
        if: github.event_name == 'workflow_dispatch'
      - uses: tdesaules/github-actions/oci/get-image-digest@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          image: ghcr.io/${{ github.repository }}/bastion:sha-${{ github.sha }}
          expected-digest: ${{ steps.verified-bastion.outputs.digest }}
        id: bastion
        if: github.event_name == 'workflow_dispatch'
      - name: Sign bastion
        uses: tdesaules/github-actions/oci/new-image-signature@e00720678192c53c13a0ba37fccd5349ea755068
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          image: ${{ steps.bastion.outputs.reference }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
      - uses: tdesaules/github-actions/oci/get-image-digest@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          image: ghcr.io/${{ github.repository }}/provision:sha-${{ github.sha }}
          expected-digest: ${{ steps.verified-provision.outputs.digest }}
        id: provision
        if: github.event_name == 'workflow_dispatch'
      - name: Sign provision
        uses: tdesaules/github-actions/oci/new-image-signature@e00720678192c53c13a0ba37fccd5349ea755068
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          image: ${{ steps.provision.outputs.reference }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
      - uses: ./.github/actions/tag-images
        with:
          version: ${{ needs.check.outputs.version }}
          bastion: ${{ steps.bastion.outputs.digest }}
          provision: ${{ steps.provision.outputs.digest }}
        if: github.event_name == 'workflow_dispatch' && !inputs.images-only
      - uses: tdesaules/github-actions/workflow/new-github-release@e00720678192c53c13a0ba37fccd5349ea755068
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          notes: docs/release-notes.md
          token: ${{ steps.bot.outputs.token }}
        if: github.ref_type == 'tag'
