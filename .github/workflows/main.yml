name: main
'on':
  push:
    branches:
      - '**'
permissions:
  contents: read
concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      platform: ${{ steps.plan.outputs.platform }}
      has_build: ${{ steps.plan.outputs.has_build }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
      images: ${{ steps.plan.outputs.images }}
      digests: ${{ steps.plan.outputs.digests }}
      shell_files: ${{ steps.files.outputs.shellcheck-files }}
      markdown_files: ${{ steps.files.outputs.markdownlint-files }}
      yaml_files: ${{ steps.files.outputs.yaml-files }}
      container_files: ${{ steps.files.outputs.hadolint-files }}
      build_images: ${{ steps.plan.outputs.build_images }}
      scan_only: ${{ steps.plan.outputs.scan_only }}
      reused: ${{ steps.plan.outputs.reused }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed source files
        id: files
        uses: tdesaules/github-actions/workflow/get-changed-files@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          before: ${{ github.event.before }}
          after: ${{ github.sha }}
          full: 'false'
      - name: Select application images and published digests
        id: plan
        uses: tdesaules/github-actions/workflow/get-image-matrix@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          application-definition: infra/infra-definition.sample.json
          event: ${{ github.event_name }}
          ref: ${{ github.ref }}
          files: ${{ steps.files.outputs.files }}
          full: ${{ steps.files.outputs.full }}
  lint:
    needs:
      - check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate shell
        if: needs.check.outputs.shell_files != '[]'
        uses: tdesaules/github-actions/lint/shellcheck@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          files: ${{ needs.check.outputs.shell_files }}
      - name: Validate YAML
        if: needs.check.outputs.yaml_files != '[]'
        uses: tdesaules/github-actions/lint/yaml@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          files: ${{ needs.check.outputs.yaml_files }}
      - name: Validate documentation
        if: needs.check.outputs.markdown_files != '[]'
        uses: tdesaules/github-actions/lint/markdownlint@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          files: ${{ needs.check.outputs.markdown_files }}
      - name: Validate workflows
        uses: tdesaules/github-actions/lint/actionlint@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          files: '[".github/workflows/main.yml", ".github/workflows/release.yml", ".github/workflows/maintenance.yml"]'
      - name: Validate Helm
        if: needs.check.outputs.platform == 'true'
        uses: tdesaules/github-actions/check/test-helmfile@be037a8ee89b4431dde66fe72c482b5e9c66d137
      - name: Validate Containerfiles
        if: needs.check.outputs.container_files != '[]'
        uses: tdesaules/github-actions/lint/hadolint@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          files: ${{ needs.check.outputs.container_files }}
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.check.outputs.build_images) }}
    needs:
      - check
      - lint
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.lint.result == 'success' && needs.check.outputs.has_build == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: tdesaules/github-actions/oci/build-image@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          containerfile: oci/${{ matrix.image }}/Containerfile
          image: localhost/${{ matrix.image }}
          version: ${{ github.sha }}
          platform: linux/amd64
          output: dist/image.oci.tar
        id: build
      - uses: tdesaules/github-actions/workflow/new-build-receipt@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          archive: dist/image.oci.tar
          output: dist/build.json
          expected-sha256: ${{ steps.build.outputs.archive-sha256 }}
          image: ${{ matrix.image }}
          architecture: amd64
          revision: ${{ github.sha }}
          version: ${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-${{ matrix.image }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.check.outputs.images) }}
    needs:
      - check
      - lint
      - build
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.lint.result == 'success' && needs.check.outputs.has_tests == 'true' && ((needs.check.outputs.has_build
      == 'true' && needs.build.result == 'success') || (needs.check.outputs.has_build == 'false' && needs.build.result == 'skipped')) }}
    services:
      candidate-registry:
        image: ghcr.io/tdesaules/github-actions/workflow-start-test-registry@sha256:e428ed0f7c5a8d1f9062a041aeeeddbfeb86cf11dcaf8f24a83a4d55173bbb8a
        ports:
          - 5000/tcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build-${{ matrix.image }}
          path: dist
        if: contains(fromJSON(needs.check.outputs.build_images), matrix.image)
      - uses: tdesaules/github-actions/workflow/test-build-artifact@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          archive: dist/image.oci.tar
          receipt: dist/build.json
          image: ${{ matrix.image }}
          architecture: amd64
          revision: ${{ github.sha }}
          version: ${{ github.sha }}
        if: contains(fromJSON(needs.check.outputs.build_images), matrix.image)
      - uses: tdesaules/github-actions/workflow/import-candidate-image@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          archive: dist/image.oci.tar
          repository: ${{ matrix.image }}
          host-port: ${{ job.services.candidate-registry.ports['5000'] }}
        id: candidate
        if: contains(fromJSON(needs.check.outputs.build_images), matrix.image)
      - uses: tdesaules/github-actions/oci/get-image-digest@be037a8ee89b4431dde66fe72c482b5e9c66d137
        if: ${{ !contains(fromJSON(needs.check.outputs.build_images), matrix.image) }}
        id: published
        with:
          image: ghcr.io/${{ github.repository }}/${{ matrix.image }}@${{ fromJSON(needs.check.outputs.digests)[matrix.image] }}
          expected-digest: ${{ fromJSON(needs.check.outputs.digests)[matrix.image] }}
      - uses: tdesaules/github-actions/workflow/new-candidate-action@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          image: ${{ steps.candidate.outputs.image || steps.published.outputs.reference }}
          destination: .candidate
          application-smoke: ${{ matrix.image }}
        if: ${{ !contains(fromJSON(needs.check.outputs.scan_only), matrix.image) }}
      # The catalog generated this action in the runner workspace for the exact candidate digest.
      - uses: ./.candidate
        if: ${{ !contains(fromJSON(needs.check.outputs.scan_only), matrix.image) }}
      - uses: tdesaules/github-actions/workflow/test-build-artifact@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          archive: dist/image.oci.tar
          receipt: dist/build.json
          image: ${{ matrix.image }}
          architecture: amd64
          revision: ${{ github.sha }}
          version: ${{ github.sha }}
          qualification: dist/qualified.json
          tested-digest: ${{ steps.candidate.outputs.digest }}
        if: contains(fromJSON(needs.check.outputs.build_images), matrix.image)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-${{ matrix.image }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
        if: contains(fromJSON(needs.check.outputs.build_images), matrix.image)
      - uses: tdesaules/github-actions/oci/new-sbom@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          source: ${{ steps.published.outputs.reference && format('registry:{0}', steps.published.outputs.reference) || 'oci-archive:dist/image.oci.tar'
            }}
        continue-on-error: true
        id: sbom
      - uses: tdesaules/github-actions/oci/test-vulnerabilities@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          sbom: sbom.spdx.json
          fail-on: none
        continue-on-error: true
        id: scan
      - uses: tdesaules/github-actions/workflow/summarize-security@be037a8ee89b4431dde66fe72c482b5e9c66d137
        continue-on-error: true
        with:
          subject: git:${{ github.sha }}
          sbom-outcome: ${{ steps.sbom.outcome }}
          scan-outcome: ${{ steps.scan.outcome }}
          sbom: sbom.spdx.json
          report: grype.json
          output: security.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: advisory-${{ matrix.image }}
          path: |-
            sbom.spdx.json
            grype.json
            security.json
          if-no-files-found: warn
        continue-on-error: true
