name: maintenance
permissions:
  contents: read
jobs:
  maintenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate maintenance event
        uses: tdesaules/github-actions/check/test-maintenance-event@be037a8ee89b4431dde66fe72c482b5e9c66d137
      - name: Classify changed source files
        id: files
        uses: tdesaules/github-actions/workflow/get-changed-files@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          before: ${{ github.event.before }}
          after: ${{ github.sha }}
          full: 'true'
      - name: Select application images and published digests
        id: plan
        uses: tdesaules/github-actions/workflow/get-image-matrix@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          application-definition: infra/infra-definition.sample.json
          event: maintenance
          ref: ${{ github.ref }}
          files: ${{ steps.files.outputs.files }}
          full: ${{ steps.files.outputs.full }}
      - name: Create repository-scoped bot token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: bot
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ai-inference-basics
      - name: Update dependencies
        uses: tdesaules/github-actions/maintenance/update-dependencies@be037a8ee89b4431dde66fe72c482b5e9c66d137
        with:
          repository: ${{ github.repository }}
          token: ${{ steps.bot.outputs.token }}
          dry-run: ${{ inputs.dry-run || false }}
      - uses: tdesaules/github-actions/lint/lychee@be037a8ee89b4431dde66fe72c482b5e9c66d137
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        with:
          files: ${{ steps.files.outputs.lychee-files }}
      - name: Generate published bastion SBOM
        uses: tdesaules/github-actions/oci/new-sbom@be037a8ee89b4431dde66fe72c482b5e9c66d137
        if: ${{ !cancelled() && steps.plan.outputs.digests != '' }}
        continue-on-error: true
        with:
          source: registry:ghcr.io/${{ github.repository }}/bastion@${{ fromJSON(steps.plan.outputs.digests).bastion }}
          output: bastion.spdx.json
      - name: Rescan bastion
        uses: tdesaules/github-actions/oci/test-vulnerabilities@be037a8ee89b4431dde66fe72c482b5e9c66d137
        if: ${{ !cancelled() && steps.plan.outputs.digests != '' }}
        continue-on-error: true
        with:
          sbom: bastion.spdx.json
          output: bastion.grype.json
          fail-on: none
      - name: Generate published provision SBOM
        uses: tdesaules/github-actions/oci/new-sbom@be037a8ee89b4431dde66fe72c482b5e9c66d137
        if: ${{ !cancelled() && steps.plan.outputs.digests != '' }}
        continue-on-error: true
        with:
          source: registry:ghcr.io/${{ github.repository }}/provision@${{ fromJSON(steps.plan.outputs.digests).provision }}
          output: provision.spdx.json
      - name: Rescan provision
        uses: tdesaules/github-actions/oci/test-vulnerabilities@be037a8ee89b4431dde66fe72c482b5e9c66d137
        if: ${{ !cancelled() && steps.plan.outputs.digests != '' }}
        continue-on-error: true
        with:
          sbom: provision.spdx.json
          output: provision.grype.json
          fail-on: none
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.plan.outputs.digests != '' }}
        continue-on-error: true
        with:
          name: maintenance-advisory
          path: |-
            *.spdx.json
            *.grype.json
          if-no-files-found: warn
'on':
  schedule:
    - cron: 17 5 * * 1
  workflow_dispatch:
    inputs:
      dry-run:
        description: Resolve dependency updates without creating pull requests
        type: boolean
        default: true
