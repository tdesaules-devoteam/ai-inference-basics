version: '3'

env:
  AI_INFERENCE_BASICS_ROOT: '{{.ROOT_DIR}}'

includes:
  devenv:
    taskfile: ./.devenv/taskfile.qemu.yaml
    dir: ./.devenv
    internal: true
  oci:
    taskfile: ./oci/taskfile.oci.yml
    dir: .
    internal: true
  cluster:
    taskfile: ./cluster/taskfile.cluster.yml
    dir: .
    internal: true

tasks:
  up:
    desc: Create and provision the local lab
    cmds:
      - task: oci:prepare
      - task: devenv:up
        vars:
          attach: 'false'
      - task: cluster:wait
  down:
    desc: Destroy the local VM
    cmds:
      - task: devenv:down
  ssh:
    desc: Connect to the local VM
    interactive: true
    cmds:
      - task: devenv:ssh
