version: '3'
vars:
  log: source .devenv/scripts/utils.sh && _log
tasks:
  python:
    internal: true
    status:
      - .local/venv/bin/python -c 'import yaml, bcrypt; assert yaml.__version__ == "6.0.3" and bcrypt.__version__ == "5.0.0"'
    cmds:
      - python3 -m venv .local/venv
      - .local/venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
  prepare:
    internal: true
    cmds:
      - task: python
      - .local/venv/bin/python cluster/prepare.py
  clean:
    internal: true
    cmds:
      - |
        if [ -d .local/build/runtime ]; then
          test -f .local/build/runtime/.generated || exit 1
          rm -rf -- .local/build/runtime
        fi
  wait:
    internal: true
    silent: true
    cmds:
      - |
        {{.log}} title 'Wait for native k0s and its Helm deployer'
        .local/venv/bin/python cluster/wait.py
