apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: '@DOMAIN@-domain'
  namespace: '@DOMAIN@'
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: '@DOMAIN@-domain'
subjects:
  - kind: ServiceAccount
    name: '@DOMAIN@-domain'
    namespace: '@DOMAIN@'
