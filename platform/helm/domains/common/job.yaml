apiVersion: batch/v1
kind: Job
metadata:
  name: '@DOMAIN@-domain'
  namespace: '@DOMAIN@'
  annotations:
    helm.sh/hook: '@HOOK@'
    helm.sh/hook-weight: '@WEIGHT@'
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    spec:
      serviceAccountName: '@DOMAIN@-domain'
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: configure
          image: '@IMAGE@'
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /scripts/job.py
          env:
            - name: LAB_HOSTNAME
              value: '@HOSTNAME@'
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: home
              mountPath: /workspace
      volumes:
        - name: scripts
          configMap:
            name: '@DOMAIN@-domain'
        - name: home
          emptyDir: {}
