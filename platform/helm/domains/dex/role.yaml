apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dex-domain
  namespace: dex
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - admin-access
      - dex-config
      - oidc-client
    verbs:
      - get
      - update
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
