fullnameOverride: headlamp
image:
  tag: v0.46.0@sha256:8a0ef97527544baa2b35825940ddf4db6e2d09c30cd5aa31fd269ff604cc8b75
config:
  baseURL: /headlamp
  unsafeUseServiceAccountToken: true
clusterRoleBinding:
  clusterRoleName: view
resources:
  requests: {cpu: 20m, memory: 64Mi}
  limits: {memory: 256Mi}
extraManifests:
  - |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: ai-inference-headlamp-inspection
    rules:
      - apiGroups: [""]
        resources: [nodes, namespaces, persistentvolumes]
        verbs: [get, list, watch]
      - apiGroups: [apiextensions.k8s.io]
        resources: [customresourcedefinitions]
        verbs: [get, list, watch]
      - apiGroups: [serving.kserve.io]
        resources: [inferenceservices, servingruntimes, clusterservingruntimes]
        verbs: [get, list, watch]
      - apiGroups: [storage.k8s.io]
        resources: [storageclasses]
        verbs: [get, list, watch]
  - |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: ai-inference-headlamp-inspection
    roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ai-inference-headlamp-inspection}
    subjects:
      - {kind: ServiceAccount, name: headlamp, namespace: headlamp}
  - |
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: browser-proxy-only
      namespace: headlamp
    spec:
      podSelector:
        matchLabels: {app.kubernetes.io/name: headlamp}
      policyTypes: [Ingress]
      ingress:
        - from:
            - namespaceSelector:
                matchLabels: {kubernetes.io/metadata.name: oauth2-proxy}
              podSelector:
                matchLabels: {app: oauth2-proxy}
          ports:
            - {protocol: TCP, port: 4466}
