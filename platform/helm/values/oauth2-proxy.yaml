fullnameOverride: oauth2-proxy
image:
  registry: quay.io
  repository: oauth2-proxy/oauth2-proxy
  tag: v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
config:
  existingSecret: oauth-config
  # Read credentials from the mounted config, avoiding stale duplicate env values.
  requiredSecretKeys: []
  cookieName: _lab_session
  forceLegacyConfig: false
extraArgs:
  config: /etc/oauth/oauth2-proxy.cfg
podLabels:
  app: oauth2-proxy
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
extraVolumes:
  - name: oauth-config
    secret: {secretName: oauth-config}
  - name: browser-router
    configMap: {name: browser-router}
extraVolumeMounts:
  - {name: oauth-config, mountPath: /etc/oauth, readOnly: true}
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 256Mi}
extraContainers:
  - name: browser-router
    image: docker.io/library/caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    command: [caddy, run, --config, /etc/browser/Caddyfile, --adapter, caddyfile]
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      # The upstream executable has cap_net_bind_service=ep; retain its bounding bit.
      capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
    resources:
      requests: {cpu: 20m, memory: 32Mi}
      limits: {memory: 128Mi}
    volumeMounts:
      - {name: browser-router, mountPath: /etc/browser, readOnly: true}
extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: browser-router
      namespace: '{{ .Release.Namespace }}'
    data:
      Caddyfile: |
        {
          admin off
          auto_https off
        }
        http://:4181 {
          bind 127.0.0.1
          route {
            @deniedA {
              path /terminal-a* /code-a*
              not header X-Forwarded-Email alice@example.test
            }
            respond @deniedA 403
            @deniedB {
              path /terminal-b* /code-b*
              not header X-Forwarded-Email bob@example.test
            }
            respond @deniedB 403
            redir /terminal-a /terminal-a/ 308
            redir /terminal-b /terminal-b/ 308
            redir /code-a /code-a/ 308
            redir /code-b /code-b/ 308
            redir /headlamp /headlamp/ 308
            handle /terminal-a/* {
              reverse_proxy bastion-a.bastion.svc.cluster.local:7681
            }
            handle /terminal-b/* {
              reverse_proxy bastion-b.bastion.svc.cluster.local:7681
            }
            handle_path /code-a/* {
              reverse_proxy bastion-a.bastion.svc.cluster.local:8080
            }
            handle_path /code-b/* {
              reverse_proxy bastion-b.bastion.svc.cluster.local:8080
            }
            handle /headlamp/* {
              reverse_proxy headlamp.headlamp.svc.cluster.local:80
            }
            respond 404
          }
        }
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: browser-gateway-only
      namespace: '{{ .Release.Namespace }}'
    spec:
      podSelector:
        matchLabels: {app: oauth2-proxy}
      policyTypes: [Ingress]
      ingress:
        - from:
            - namespaceSelector:
                matchLabels: {kubernetes.io/metadata.name: gateway}
              podSelector:
                matchLabels: {gateway.envoyproxy.io/owning-gateway-name: ai-inference-basics}
          ports:
            - {protocol: TCP, port: 4180}
