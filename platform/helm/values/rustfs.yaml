fullnameOverride: rustfs
replicaCount: 1
mode:
  standalone:
    enabled: true
    strategy:
      type: Recreate
  distributed:
    enabled: false
image:
  rustfs:
    repository: docker.io/rustfs/rustfs
    tag: 1.0.5@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74
  initImage:
    repository: docker.io/library/busybox
    tag: 1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
secret:
  existingSecret: rustfs-root
storageclass:
  name: local-path-provisioner
  dataStorageSize: 20Gi
config:
  rustfs:
    obs_log_directory: ""
    console_enable: "false"
ingress:
  enabled: false
gatewayApi:
  enabled: false
service:
  type: ClusterIP
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 2Gi

# The upstream chart renders extraManifests through tpl. No separate bootstrap chart.
extraManifests:
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: rustfs-buckets
      namespace: '{{ .Release.Namespace }}'
      annotations:
        helm.sh/hook: post-install,post-upgrade
        helm.sh/hook-delete-policy: before-hook-creation
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: initialize-buckets
              image: public.ecr.aws/aws-cli/aws-cli:2.31.35@sha256:b3fc08b324bbba025c6bf34cded7f5c3e869392b8fb33e863b272258b9a4b52c
              command: [/bin/bash, -ec]
              args:
                - |
                  export AWS_PAGER="" AWS_EC2_METADATA_DISABLED=true
                  aws configure set default.s3.addressing_style path
                  s3() { aws --endpoint-url "$S3_ENDPOINT" --region us-east-1 s3api "$@"; }
                  for bucket in loki tempo mimir-blocks mimir-ruler mimir-alertmanager models; do
                    if ! s3 head-bucket --bucket "$bucket" 2>/dev/null; then
                      s3 create-bucket --bucket "$bucket"
                    fi
                    s3 head-bucket --bucket "$bucket"
                  done
                  echo 'Six application buckets are available.'
              env:
                - name: S3_ENDPOINT
                  value: http://rustfs-svc.rustfs.svc.cluster.local:9000
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-root
                      key: RUSTFS_ACCESS_KEY
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-root
                      key: RUSTFS_SECRET_KEY
              resources:
                requests:
                  cpu: 20m
                  memory: 128Mi
                limits:
                  memory: 512Mi
