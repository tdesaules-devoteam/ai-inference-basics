fullnameOverride: tempo
replicas: 1
tempo:
  registry: docker.io
  repository: grafana/tempo
  tag: 3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
  reportingEnabled: false
  retention: 24h
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 768Mi
  extraArgs:
    config.expand-env: "true"
  extraEnvFrom:
    - secretRef:
        name: s3-observability
  storage:
    trace:
      backend: s3
      s3:
        bucket: tempo
        endpoint: rustfs-svc.rustfs.svc.cluster.local:9000
        region: us-east-1
        access_key: ${AWS_ACCESS_KEY_ID}
        secret_key: ${AWS_SECRET_ACCESS_KEY}
        insecure: true
        forcepathstyle: true
      wal:
        path: /var/tempo/wal
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  metricsGenerator:
    enabled: false
tempoQuery:
  enabled: false
persistence:
  enabled: true
  storageClassName: local-path-provisioner
  size: 1Gi
serviceMonitor:
  enabled: false
