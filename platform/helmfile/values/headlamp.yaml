fullnameOverride: headlamp
image:
  tag: v0.46.0@sha256:8a0ef97527544baa2b35825940ddf4db6e2d09c30cd5aa31fd269ff604cc8b75
config:
  baseURL: /headlamp
  # The shared admin uses this identity; the ingress policy below limits access to the browser proxy.
  unsafeUseServiceAccountToken: true
clusterRoleBinding:
  clusterRoleName: cluster-admin
resources:
  requests: {cpu: 20m, memory: 64Mi}
  limits: {memory: 256Mi}
extraManifests:
  - |
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: browser-proxy-only
      namespace: headlamp
    spec:
      podSelector:
        matchLabels: {app.kubernetes.io/name: headlamp}
      policyTypes: [Ingress]
      ingress:
        - from:
            - namespaceSelector:
                matchLabels: {kubernetes.io/metadata.name: oauth2-proxy}
              podSelector:
                matchLabels: {app: oauth2-proxy}
          ports:
            - {protocol: TCP, port: 4466}
