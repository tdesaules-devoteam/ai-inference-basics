fullnameOverride: grafana
image:
  registry: docker.io
  repository: grafana/grafana
  tag: 13.3.2-distroless@sha256:d9425e704fa9dff189966b827fbc9b63befc5b443999c7b82193f1b1a73c74f7
replicas: 1
deploymentStrategy:
  type: Recreate
admin:
  existingSecret: admin-login
  userKey: email
  passwordKey: password
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
persistence:
  enabled: true
  storageClassName: local-path-provisioner
  size: 1Gi
initChownData:
  enabled: false
testFramework:
  enabled: false
sidecar:
  dashboards:
    enabled: false
  datasources:
    enabled: false
dashboards: {}
dashboardProviders: {}
grafana.ini:
  server:
    domain: '{{ .Values.hostname }}'
    root_url: '{{ .Values.origin }}/grafana/'
    serve_from_sub_path: true
  security:
    admin_email: '{{ .Values.adminEmail }}'
  analytics:
    reporting_enabled: false
    check_for_updates: false
  auth:
    disable_login_form: true
  auth.basic:
    enabled: false
  auth.proxy:
    enabled: true
    header_name: X-Forwarded-Email
    header_property: email
    auto_sign_up: true
    enable_login_token: true
  users:
    allow_sign_up: false
    auto_assign_org_role: Admin
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        uid: mimir
        type: prometheus
        access: proxy
        url: http://mimir-gateway.mimir.svc.cluster.local/prometheus
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.loki.svc.cluster.local:3100
        editable: false
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.tempo.svc.cluster.local:3200
        editable: false
extraObjects:
  - apiVersion: policies.kyverno.io/v1
    kind: GeneratingPolicy
    metadata:
      name: grafana-admin-access
    spec:
      evaluation:
        generateExisting:
          enabled: true
        synchronize:
          enabled: true
        orphanDownstreamOnPolicyDelete:
          enabled: true
      matchConstraints:
        resourceRules:
          - apiGroups:
              - ""
            apiVersions:
              - v1
            operations:
              - CREATE
              - UPDATE
            resources:
              - namespaces
            resourceNames:
              - grafana
      variables:
        - name: source
          expression: resource.Get("v1", "secrets", "dex", "admin-login")
      generate:
        - expression: generator.Apply("grafana", [variables.source])
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: browser-proxy-only
      namespace: '{{ .Release.Namespace }}'
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: grafana
      policyTypes:
        - Ingress
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: oauth2-proxy
              podSelector:
                matchLabels:
                  app: oauth2-proxy
          ports:
            - protocol: TCP
              port: 3000
