# Scaleway supplies the NVIDIA driver. Only configure the container runtime.
driver:
  enabled: false
devicePlugin:
  enabled: false
gfd:
  enabled: false
migManager:
  enabled: false
mig:
  strategy: none
dcgm:
  enabled: false
dcgmExporter:
  enabled: false
nodeStatusExporter:
  enabled: false
cdi:
  enabled: false
operator:
  version: v26.7.3@sha256:18883be4960102f24997273572015fb380801d1c791bbe6f8a599cc67e180c29
validator:
  version: v26.7.3@sha256:18883be4960102f24997273572015fb380801d1c791bbe6f8a599cc67e180c29
  cuda:
    env:
      - name: WITH_WORKLOAD
        value: "false"
hostPaths:
  kubeletRootDir: /var/lib/k0s/kubelet
toolkit:
  enabled: true
  version: v1.20.2@sha256:58b5a82a618b531747e7c287c91a6c9f346de108fb935050ce356acdacbbc57d
  env:
    - name: CONTAINERD_CONFIG
      value: /etc/k0s/containerd.d/nvidia.toml
    - name: CONTAINERD_SOCKET
      value: /run/k0s/containerd.sock
    - name: CONTAINERD_RUNTIME_CLASS
      value: nvidia
    - name: CONTAINERD_SET_AS_DEFAULT
      value: "false"
    - name: RUNTIME_CONFIG_SOURCE
      value: file=/etc/k0s/containerd.toml
node-feature-discovery:
  image:
    tag: v0.20.1@sha256:6fc5c9af9176e1acb5ce57a4a1d0c0d3eb25cd34f5bdd0efefebf0efe45a8379
