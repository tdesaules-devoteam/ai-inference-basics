version: '3'
tasks:
  check:
    desc: Check the adapted devenv runtime
    cmds: ['bash scripts/devenv.sh check']
  up:
    desc: Start the adapted runtime without attaching SSH
    cmds: ['bash scripts/devenv.sh up attach=false']
  status:
    desc: Inspect this checkout's QEMU process
    cmds: ['bash scripts/devenv.sh status']
  ssh:
    desc: Connect to this checkout's QEMU VM
    interactive: true
    cmds: ['bash scripts/devenv.sh ssh']
  stop:
    desc: Stop QEMU and preserve guest data
    cmds: ['bash scripts/devenv.sh stop']
  down:
    desc: Dispose of this checkout's guest disk
    cmds: ['bash scripts/devenv.sh down']
