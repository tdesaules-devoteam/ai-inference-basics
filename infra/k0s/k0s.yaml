apiVersion: k0s.k0sproject.io/v1beta1
kind: ClusterConfig
metadata:
  name: ai-inference-basics
spec:
  api:
    sans:
    - 127.0.0.1
    - localhost
  network:
    provider: kuberouter
  telemetry:
    enabled: false
  extensions:
    helm:
      concurrencyLevel: 1
      charts:
        - name: ai-inference-basics-foundation
          chartname: /var/lib/k0s/charts/ai-inference-basics.tgz
          version: 0.3.0-alpha.1
          namespace: ai-inference-basics
          order: 1
          timeout: 10m
          forceUpgrade: false
          values: |
            envoyGateway:
              enabled: true
              config:
                envoyGateway:
                  extensionApis:
                    enableBackend: true
                  extensionManager:
                    hooks:
                      xdsTranslator:
                        translation:
                          listener: {includeAll: true}
                          route: {includeAll: true}
                          cluster: {includeAll: true}
                          secret: {includeAll: true}
                        post: [Translation, Cluster, Route]
                    service:
                      fqdn:
                        hostname: ai-gateway-controller.ai-inference-basics.svc.cluster.local
                        port: 1063
            cert-manager:
              enabled: true
        - name: ai-inference-basics-crds
          chartname: /var/lib/k0s/charts/ai-inference-basics.tgz
          version: 0.3.0-alpha.1
          namespace: ai-inference-basics
          order: 2
          timeout: 5m
          forceUpgrade: false
          values: |
            kserveCRDs: {enabled: true}
            llmCRDs: {enabled: true}
            aiCRDs: {enabled: true}
        - name: ai-inference-basics-controllers
          chartname: /var/lib/k0s/charts/ai-inference-basics.tgz
          version: 0.3.0-alpha.1
          namespace: ai-inference-basics
          order: 3
          timeout: 10m
          forceUpgrade: false
          values: |
            kserveController: {enabled: true}
            llmController: {enabled: true}
            agent-router: {enabled: true}
        - name: ai-inference-basics
          chartname: /var/lib/k0s/charts/ai-inference-basics.tgz
          version: 0.3.0-alpha.1
          namespace: ai-inference-basics
          order: 4
          timeout: 20m
          forceUpgrade: false
          values: |
            gateway:
              enabled: true
              hostname: __LAB_HOSTNAME__
            access: {enabled: true}
            dex: {enabled: true}
            headlamp: {enabled: true}
            workspaces:
              enabled: true
              image: __BASTION_IMAGE__
              imagePullPolicy: Never
            models: {enabled: true}
            api: {enabled: true}
            observability: {enabled: true}
  images:
    coredns:
      image: quay.io/k0sproject/coredns
      version: 1.14.7-k0s.1@sha256:4e96879ebe60146d9082c2746ae3640ab2336a42d6c6dae40ace8f84a4aa403b
    default_pull_policy: IfNotPresent
    konnectivity:
      image: quay.io/k0sproject/apiserver-network-proxy-agent
      version: v0.37.0-k0s.1@sha256:f0bac8fdedf836cdaaee4048b078df8ed67338fa14041adc20cfe0bde8f2cac9
    kubeproxy:
      image: quay.io/k0sproject/kube-proxy
      version: v1.37.2@sha256:b24d9f8b5e0265ac14fb532856e84af957eae2fb8fd38f8240c42b76e76e09a7
    kuberouter:
      cni:
        image: quay.io/k0sproject/kube-router
        version: v2.11.1-iptables1.8.13-k0s.2@sha256:d54312816a3f5d6ffbbd1130b6ddea47596e1a0aedae27527c67f7e54ca2ce07
      cniInstaller:
        image: quay.io/k0sproject/cni-node
        version: v1.9.1-k0s.2@sha256:5d8ba4095bf5ebe92ffefda79c7686f574c03de45ccaa7308b2b0249017aad79
    metricsserver:
      image: quay.io/k0sproject/metrics-server
      version: v0.9.0-k0s.2@sha256:f88174cb39de0710fd127a198bc39441faa5b95d302209347f5f4c755943efde
    pause:
      image: quay.io/k0sproject/pause
      version: 3.10.2-0@sha256:1dca17073186db812f380970077f5c82842c810f1bd75800cd926ab50cd34243
